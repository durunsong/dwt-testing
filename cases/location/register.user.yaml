# 注册 / 登录 / admin 短信记录 元素定位
# 优先级: data-testid -> placeholder -> text -> role -> css

# ===== 注册页面 =====
register_page_title:
  testId: "register-page"
  fallback:
    - text: "注册您的全球收款账户"
    - text: "注册账号"

register_tab_email:
  testId: "register-tab-email"
  fallback:
    - text: "邮箱注册"

register_tab_phone:
  testId: "register-tab-phone"
  fallback:
    - text: "手机号注册"

register_input_email:
  testId: "register-input-email"
  fallback:
    - placeholder: "请输入邮箱"
    - name: "register_email"

register_input_phone:
  css: "[data-testid='register-input-phone'] .m-input-phone-number__phone-input input"
  fallback:
    - css: "[data-testid='register-input-phone'] input[name='phone']:not([readonly])"
    - css: ".phone-item .m-input-phone-number__phone-input input"
    - css: ".MazPhoneInputStyle .m-input-phone-number__phone-input input"
    - css: "input[name='phone']:not([readonly])"
    - placeholder: "请输入手机号"

register_country_code_selector:
  css: ".m-input-phone-number__country-select"
  fallback:
    - css: ".MazPhoneInputStyle .country-selector"
    - text: "+86"
    - name: "country_code"
    - role: "combobox"

register_input_email_verify:
  testId: "register-input-email-verify"
  fallback:
    - placeholder: "请输入邮箱验证码"

register_input_phone_verify:
  testId: "register-input-phone-verify"
  fallback:
    - name: "register_verify_code_mobile"
    - placeholder: "请输入手机验证码"
    - placeholder: "请输入验证码"

register_get_verify_code:
  testId: "register-get-verify-code"
  fallback:
    - text: "获取验证码"

register_input_password:
  testId: "register-input-password"
  fallback:
    - placeholder: "设置登录密码"

register_input_password_confirm:
  testId: "register-input-password-confirm"
  fallback:
    - placeholder: "请确认登录密码"

register_agree_checkbox:
  testId: "register-agree-checkbox"
  fallback:
    - css: "[data-testid='register-agree-checkbox'] .el-checkbox__input"
    - text: "我已阅读并同意遵守"
    - role: "checkbox"

register_submit:
  testId: "register-submit"
  fallback:
    - text: "注册"

register_login_link:
  testId: "register-login-link"
  fallback:
    - text: "立即登录"

# ===== 用户登录页面 =====
login_page_title:
  testId: "login-page"
  fallback:
    - text: "登录你的全球收款账户"
    - text: "账户密码登录"

login_tab_password:
  testId: "login-tab-password"
  fallback:
    - text: "账户密码登录"

login_tab_verify_code:
  testId: "login-tab-verify-code"
  fallback:
    - text: "验证码登录"

login_input_account:
  testId: "user-login-username"
  fallback:
    - placeholder: "请输入账号"
    - placeholder: "请输入您的手机号或邮箱"
    - name: "username"

login_input_password:
  testId: "user-login-password"
  fallback:
    - placeholder: "请输入密码"
    - placeholder: "请输入您的登录密码"
    - name: "password"

login_input_verify_code:
  testId: "login-input-verify-code"
  fallback:
    - placeholder: "请输入验证码"
    - placeholder: "请输入邮箱验证码"
    - placeholder: "请输入手机验证码"

login_get_verify_code:
  testId: "login-get-verify-code"
  fallback:
    - text: "获取验证码"

login_submit:
  testId: "user-login-submit"
  fallback:
    - text: "登录"

login_register_link:
  testId: "login-register-link"
  fallback:
    - text: "去注册"

login_forget_pwd:
  text: "忘记密码?"

user_login_username:
  testId: "user-login-username"
  fallback:
    - placeholder: "请输入账号"
    - placeholder: "请输入您的手机号或邮箱"
    - name: "username"

user_login_password:
  testId: "user-login-password"
  fallback:
    - placeholder: "请输入密码"
    - placeholder: "请输入您的登录密码"
    - name: "password"

user_login_submit:
  testId: "user-login-submit"
  fallback:
    - role: "button"
      name: "登录"
    - text: "登录"

register_success_notify:
  fallback:
    - text: "注册成功"
    - css: ".auth-redirect-countdown-text"
    - text: "秒后"

# ===== 登录成功断言 =====
user_home_marker:
  testId: "user-home"
  fallback:
    - text: "资产余额"
    - text: "欢迎"
    - text: "欢迎进入 Dowalet"
    - text: "首页"
    - text: "工作台"

user_activate_account:
  testId: "user-activate-account"
  fallback:
    - text: "去激活账户"
    - role: "button"
      name: "去激活账户"

# ===== admin 登录 =====
admin_login_username:
  testId: "admin-login-username"
  fallback:
    - placeholder: "请输入账号"
    - placeholder: "请输入您的手机号或邮箱"
    - name: "username"

admin_login_password:
  testId: "admin-login-password"
  fallback:
    - placeholder: "请输入密码"
    - placeholder: "请输入您的登录密码"
    - name: "password"

admin_login_submit:
  testId: "admin-login-submit"
  fallback:
    - role: "button"
      name: "登录"
    - text: "登录"

# ===== admin 短信记录（系统日志） =====
admin_sms_record_tab:
  testId: "admin-sms-record-tab"
  fallback:
    - text: "短信记录"
    - text: "系统日志"

admin_message_menu:
  text: "系统日志"
  fallback:
    - text: "短信记录"

admin_message_search:
  text: "搜索"

admin_message_first_row:
  testId: "admin-sms-first-row"
  fallback:
    - css: ".el-table__body-wrapper tbody tr.el-table__row"
    - role: "row"
      index: 0

admin_message_content:
  testId: "admin-sms-content-cell"
  fallback:
    - css: ".el-table__body-wrapper tbody tr.el-table__row:first-child td:nth-child(5) .cell"

admin_message_copy:
  text: "复制"
