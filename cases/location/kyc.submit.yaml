kyc_boss_id_front_upload:
  testId: "kyc-boss-id-front-upload"
  fallback:
    - text: "头像页"
    - text: "正面"

kyc_boss_id_back_upload:
  testId: "kyc-boss-id-back-upload"
  fallback:
    - text: "国徽页"
    - text: "反面"

kyc_boss_id_handheld_upload:
  testId: "kyc-boss-id-handheld-upload"
  fallback:
    - text: "个人信息页"
    - text: "手持"

kyc_id_card_no:
  testId: "kyc-id-card-no"
  fallback:
    - placeholder: "请填写正确的证件号码"

kyc_boss_birthday:
  placeholder: "出生日期"

kyc_boss_id_start:
  placeholder: "派发日期"

kyc_boss_id_long_term:
  text: "证件长期有效"

kyc_boss_shareholding:
  placeholder: "请填写持股比率"

kyc_boss_live_address:
  placeholder: "请输入详细地址"

kyc_step2_next:
  testId: "kyc-step2-next"
  fallback:
    - text: "下一步"

# ===== 企业认证 Step3 =====
kyc_preview_marker:
  testId: "kyc-preview"
  fallback:
    - text: "预览提交"
    - text: "提交申请"

kyc_submit:
  testId: "kyc-submit"
  fallback:
    - text: "提交申请"
    - text: "提交审核"
    - text: "提交"

kyc_status:
  testId: "kyc-status"
  fallback:
    - text: "企业认证提交成功"
    - text: "待审核"
    - text: "审核中"
    - text: "审批中，请耐心等待"

kyc_submit_success:
  text: "企业认证提交成功"
  fallback:
    - text: "待审核"
    - text: "审核通过"
    - text: "我们将在1-2个工作日内"

