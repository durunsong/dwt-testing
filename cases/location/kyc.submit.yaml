# KYC 提交流程定位（user 端：个人认证 + 企业认证）
# 优先级: data-testid -> placeholder -> text -> role -> css

# ===== 首页 / Header =====
user_activate_account:
  testId: "user-activate-account"
  fallback:
    - text: "去激活账户"
    - role: "button"
      name: "去激活账户"

user_home_marker:
  testId: "user-home"
  fallback:
    - text: "资产余额"
    - text: "欢迎"
    - text: "欢迎进入 Dowalet"
    - text: "首页"
    - text: "工作台"

user_kyc_menu:
  testId: "user-kyc-menu"
  fallback:
    - text: "去新增企业认证"
    - text: "新增企业"
    - text: "企业认证"

# ===== 个人认证 /settings/userAuth =====
user_auth_page_marker:
  testId: "user-auth-page"
  fallback:
    - text: "用户认证"
    - text: "证件照片"

user_auth_country:
  placeholder: "请选择认证国家/地区"
  fallback:
    - text: "国籍"

user_auth_id_upload:
  testId: "user-auth-id-upload"
  fallback:
    - css: ".cert-photo-item input[type='file']"
    - css: ".img-picker input[type='file']"
    - text: "证件照片"

user_auth_last_name:
  testId: "user-auth-last-name"
  fallback:
    - placeholder: "姓"

user_auth_first_name:
  testId: "user-auth-first-name"
  fallback:
    - placeholder: "名"

user_auth_id_number:
  testId: "user-auth-id-number"
  fallback:
    - placeholder: "请填写真实证件号"

user_auth_next_step:
  text: "下一步"
  fallback:
    - role: "button"
      name: "下一步"

user_auth_ocr_success:
  text: "已自动识别并填充证件信息"
  fallback:
    - text: "上传后将自动识别并填充证件信息"

# ===== 企业认证 Step1 =====
kyc_step1_marker:
  testId: "kyc-step1"
  fallback:
    - text: "企业信息"
    - text: "企业认证流程"

kyc_license_upload:
  testId: "kyc-license-upload"
  fallback:
    - css: "input[type='file'][name*='license'], input[type='file'][name*='License']"
    - css: ".img-picker input[type='file']"
    - text: "统一社会信用代码证"
    - text: "营业执照"

kyc_office_upload:
  testId: "kyc-office-upload"
  fallback:
    - css: "input[type='file'][name*='office'], input[type='file'][name*='Office']"
    - text: "企业办公场景"
    - text: "办公场所"

kyc_enterprise_name:
  testId: "kyc-enterprise-name"
  fallback:
    - placeholder: "请填写企业中文名称"

kyc_enterprise_en_name:
  placeholder: "请填写企业英文名称"

kyc_license_no:
  testId: "kyc-license-no"
  fallback:
    - placeholder: "一般为18或15位数字或字母"
    - placeholder: "请输入营业执照号"

kyc_reg_address_detail:
  placeholder: "请输入详细地址"

kyc_same_as_reg_address:
  text: "与注册地址一致"

kyc_setup_date:
  placeholder: "选择日期"

kyc_long_term_valid:
  text: "长期有效"

kyc_history_export:
  placeholder: "请输入历史年出口金额，且为整数"

kyc_estimate_export:
  placeholder: "请输入预估年出口金额，且为整数"

kyc_step1_next:
  testId: "kyc-step1-next"
  fallback:
    - text: "下一步"
    - role: "button"
      name: "下一步"

# ===== 企业认证 Step2 =====
kyc_step2_marker:
  testId: "kyc-step2"
  fallback:
    - text: "重要成员"

kyc_boss_person_type:
  placeholder: "请选择成员身份（多选）"

kyc_legal_person:
  testId: "kyc-legal-person"
  fallback:
