case_id: "register_email_verifycode_login"
case_name: "邮箱注册并验证码登录"
case_type: "user-main"
description: "用户在注册页选择邮箱注册完成注册，等待倒计时跳转后在登录页切换到验证码登录tab，获取登录验证码并登录新账号。"
mode: hybrid
defaults:
  step_timeout_ms: 30000
  wait_for_network: true
sessions:
  - name: user
    login_url: "${env.USER_LOGIN_URL}"
    register_url: "${env.USER_REGISTER_URL}"
    username: ""
    password: "${env.USER_REGISTER_PASSWORD}"
  - name: admin
    login_url: "${env.ADMIN_LOGIN_URL}"
    username: "${env.ADMIN_USERNAME}"
    password: "${env.ADMIN_PASSWORD}"
variables:
  email: "${mail_email}"
  password: "Test@12345"
  register_verify_code: ""
  login_verify_code: ""
locations:
  file: "cases/location/register.user.yaml"
steps:
  # ==================== 注册阶段 ====================
  - step_id: open_login
    name: 打开登录页
    type: web_open
    session: user
    url: "${session.login_url}"

  - step_id: goto_register_from_login
    name: 从登录页进入注册
    type: web_click
    session: user
    target: login_register_link

  - step_id: wait_register_page
    name: 等待注册页加载
    type: web_wait_element
    session: user
    target: register_page_title

  - step_id: click_email_tab
    name: 点击邮箱注册tab
    type: web_click
    session: user
    target: register_tab_email

  - step_id: input_email
    name: 填写注册邮箱
    type: web_input
    session: user
    target: register_input_email
    value: "${var.email}"

  - step_id: get_register_verify_code
    name: 点击获取注册验证码
    type: web_click
    session: user
    target: register_get_verify_code
    wait_for_network: true

  - step_id: wait_register_code_sent
    name: 等待注册验证码发送
    type: web_wait_element
    session: user
    target: register_input_email_verify

  # 获取注册验证码
  - use: common/get_verify_code_from_admin
    with:
      admin_session: admin
      save_as: register_verify_code
      filter_target: "${var.email}"

  - step_id: input_register_verify_code
    name: 填写注册验证码
    type: web_input
    session: user
    target: register_input_email_verify
    value: "${var.register_verify_code}"

  - step_id: input_password
    name: 填写密码
    type: web_input
    session: user
    target: register_input_password
    value: "${var.password}"

  - step_id: input_password_confirm
    name: 填写确认密码
    type: web_input
    session: user
    target: register_input_password_confirm
    value: "${var.password}"

  - step_id: agree_terms
    name: 勾选服务协议
    type: web_click
    session: user
    target: register_agree_checkbox

  - step_id: submit_register
    name: 点击注册
    type: web_click
    session: user
    target: register_submit
    wait_for_api:
      url: /auth/register
      method: POST
      expected_status: 200
      business_code_path: code
      success_codes: ["0000"]

  - step_id: wait_success_notify
    name: 等待注册成功通知
    type: web_wait_element
    session: user
    target: register_success_notify
    continue_on_failure: true

  - step_id: open_login_after_register
    name: 注册后打开登录页
    type: web_open
    session: user
    url: "${env.USER_HOME_URL}login?username=${var.email}"
    timeout_ms: 30000
    continue_on_failure: true

  - step_id: click_password_login_tab
    name: 切换到账户密码登录
    type: web_click
    session: user
    target: login_tab_password
    timeout_ms: 30000
    continue_on_failure: true

  - step_id: user_password_login
    name: 使用密码登录新账号
    type: flow_login
    session: user
    username: "${var.email}"
    password: "${var.password}"
    timeout_ms: 60000

  - step_id: assert_dashboard
    name: 断言已跳转到 dashboard
    type: web_assert_visible
    session: user
    target: user_home_marker
    timeout_ms: 45000
