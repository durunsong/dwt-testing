case_id: "kyc_submit"
case_name: "KYC 提交流程"
case_type: "user-main"
description: "邮箱注册并验证码登录后，点击 header「去激活账户」，完成个人认证（如需）与企业认证全流程提交。"
mode: hybrid
defaults:
  step_timeout_ms: 45000
  wait_for_network: true
sessions:
  - name: user
    login_url: "${env.USER_LOGIN_URL}"
    register_url: "${env.USER_REGISTER_URL}"
    username: ""
    password: "${env.USER_REGISTER_PASSWORD}"
  - name: admin
    login_url: "${env.ADMIN_LOGIN_URL}"
    username: "${env.ADMIN_USERNAME}"
    password: "${env.ADMIN_PASSWORD}"
variables:
  email: "${kyc_mail_email}"
  password: "${env.USER_REGISTER_PASSWORD}"
  register_verify_code: ""
  login_verify_code: ""
  enterprise_name: "${env.KYC_ENTERPRISE_NAME_PREFIX}_${timestamp}"
  license_no: "${env.KYC_LICENSE_NO_PREFIX}${timestamp}"
  legal_person: "${env.KYC_LEGAL_PERSON}"
  id_card_no: "${env.KYC_ID_CARD_NO}"
  reg_address_detail: "自动化测试详细地址001号"
locations:
  file: "cases/location/kyc.submit.yaml"
upload_slots:
  - step_id: upload_user_auth_id
    name: 上传个人认证证件照片
    type: web_upload
    session: user
    target: user_auth_id_upload
    file: "uploads/cases/kyc_submit/Snipaste_2026-03-02_18-32-35.png"

  - step_id: upload_business_license
    name: 上传企业营业执照
    type: web_upload
    session: user
    target: kyc_license_upload
    file: "uploads/cases/kyc_submit/20260106-183548.jpg"

  - step_id: upload_office_scene
    name: 上传企业办公场景
    type: web_upload
    session: user
    target: kyc_office_upload
    file: "uploads/cases/kyc_submit/20260106-183548.jpg"

  - step_id: upload_boss_id_front
    name: 上传法人身份证正面
    type: web_upload
    session: user
    target: kyc_boss_id_front_upload
    file: "uploads/cases/kyc_submit/Snipaste_2026-03-02_18-32-35.png"

  - step_id: upload_boss_id_back
    name: 上传法人身份证背面
    type: web_upload
    session: user
    target: kyc_boss_id_back_upload
    file: "uploads/cases/kyc_submit/20260106-183532.jpg"

  - step_id: upload_boss_id_handheld
    name: 上传法人手持身份证
    type: web_upload
    session: user
    target: kyc_boss_id_handheld_upload
    file: "uploads/cases/kyc_submit/Snipaste_2026-03-02_18-32-35.png"
steps:
  # ==================== 注册阶段 ====================
  - step_id: open_login_for_register
    name: 打开登录页
    type: web_open
    session: user
    url: "${session.login_url}"

  - step_id: goto_register_from_login
    name: 从登录页进入注册
    type: web_click
    session: user
    target: login_register_link
    wait_for_network: true

  - step_id: wait_register_page
    name: 等待注册页加载
    type: web_wait_element
    session: user
    target: register_page_title

  - step_id: click_email_tab
    name: 点击邮箱注册 tab
    type: web_click
    session: user
    target: register_tab_email

  - step_id: input_email
    name: 填写注册邮箱
    type: web_input
    session: user
    target: register_input_email
    value: "${var.email}"

  - step_id: get_register_verify_code
    name: 点击获取注册验证码
    type: web_click
    session: user
    target: register_get_verify_code
    wait_for_network: true

  - step_id: wait_register_code_sent
    name: 等待注册验证码输入框
    type: web_wait_element
    session: user
    target: register_input_email_verify

  - use: common/get_verify_code_from_admin
    with:
      admin_session: admin
      save_as: register_verify_code
      filter_target: "${var.email}"

  - step_id: input_register_verify_code
    name: 填写注册验证码
    type: web_input
    session: user
    target: register_input_email_verify
    value: "${var.register_verify_code}"

  - step_id: input_password
    name: 填写密码
    type: web_input
    session: user
    target: register_input_password
    value: "${var.password}"

  - step_id: input_password_confirm
    name: 填写确认密码
    type: web_input
    session: user
    target: register_input_password_confirm
    value: "${var.password}"

  - step_id: agree_terms
    name: 勾选服务协议
    type: web_click
    session: user
    target: register_agree_checkbox

  - step_id: submit_register
    name: 点击注册
    type: web_click
    session: user
    target: register_submit
    wait_for_api:
      url: /auth/register
      method: POST
      expected_status: 200
      business_code_path: code
      success_codes: ["0000"]

  - step_id: wait_success_notify
    name: 等待注册成功
    type: web_wait_element
    session: user
    target: register_success_notify
    continue_on_failure: true

  - step_id: open_login_after_register
    name: 注册后打开登录页
    type: web_open
    session: user
    url: "${env.USER_HOME_URL}login?username=${var.email}"
    timeout_ms: 30000
    continue_on_failure: true

  # ==================== 密码登录阶段 ====================
  - step_id: click_password_login_tab
    name: 切换到账户密码登录
    type: web_click
    session: user
    target: login_tab_password
    timeout_ms: 30000
    continue_on_failure: true

  - step_id: user_password_login
    name: 使用密码登录新账号
    type: flow_login
    session: user
    username: "${var.email}"
    password: "${var.password}"
    timeout_ms: 60000

  - step_id: assert_dashboard
    name: 断言已进入首页
    type: web_assert_visible
    session: user
    target: user_home_marker
    timeout_ms: 45000

  # ==================== KYC 激活与提交流程 ====================
  - step_id: click_activate_account
    name: 点击 header 去激活账户
    type: web_click
    session: user
    target: user_activate_account
    wait_for_network: true

  - step_id: wait_kyc_entry
    name: 等待进入认证页面
    type: web_wait_element
    session: user
    target: user_auth_page_marker
    continue_on_failure: true

  - step_id: user_submit_kyc
    name: 完成个人认证与企业认证提交
    type: flow_submit_kyc
    session: user
    timeout_ms: 180000

  - step_id: user_assert_pending
    name: 断言提交成功进入待审核
    type: web_assert_text
    session: user
    target: kyc_submit_success
    expected: "审批中，请耐心等待..."
